name: Build APK

on:
  push:
    branches: [ main, kotlin-rewrite, takeout-export ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        # More heap than gradle.properties (6g): R8 on the thousands of generated MTP classes ran out of memory
        # on 17/11 (twice in a row). The runner has 16 GB; the rest is left for the Kotlin daemon and the system.
        run: gradle --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx10g -Dfile.encoding=UTF-8" :app:assembleRelease

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | grep -E "SHA-256|DN" || true
          VERSION=$(grep -oP 'appVersionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out && cp "$APK" "out/tgbackup-$VERSION.apk"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tg-backup
          path: out/*.apk

      - name: Attach APK to the matching GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'appVersionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" out/*.apk --clobber
          else
            echo "No release v$VERSION — skipping"
          fi
